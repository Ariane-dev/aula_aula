    </main>

<script>
  const carrossel = document.querySelector('.carrossel');
  let isDown = false;
  let startX;
  let scrollLeft;
  if (carrossel) {
    // Drag to scroll
    carrossel.addEventListener('mousedown', (e) => {
      isDown = true;
      carrossel.classList.add('active');
      startX = e.pageX - carrossel.offsetLeft;
      scrollLeft = carrossel.scrollLeft;
    });
    carrossel.addEventListener('mouseleave', () => {
      isDown = false;
      carrossel.classList.remove('active');
    });
    carrossel.addEventListener('mouseup', () => {
      isDown = false;
      carrossel.classList.remove('active');
    });
    carrossel.addEventListener('mousemove', (e) => {
      if (!isDown) return;
      e.preventDefault();
      const x = e.pageX - carrossel.offsetLeft;
      const walk = (x - startX) * 1.5;
      carrossel.scrollLeft = scrollLeft - walk;
    });

    // Slider automático card a card
    function sliderCarrossel() {
      if (!carrossel) return;
      const cards = carrossel.querySelectorAll('.card');
      const card = cards[0];
      if (!card) return;
      const cardWidth = card.offsetWidth + parseInt(getComputedStyle(carrossel).gap || 0);
      let currentIndex = 1; // começa no primeiro card original
      const totalCards = cards.length;

      function goToCard(index, smooth = true) {
        carrossel.scrollTo({
          left: cardWidth * index,
          behavior: smooth ? 'smooth' : 'auto'
        });
      }

      // Snap centralizado ao iniciar
      goToCard(currentIndex, false);

      let sliderInterval;
      let isJumping = false;
      function startSlider() {
        sliderInterval = setInterval(() => {
          if (isJumping) return;
          currentIndex++;
          goToCard(currentIndex);
          // Se chegou no clone final, volta pro card original sem animação e sem travar
          if (currentIndex === totalCards - 1) {
            isJumping = true;
            goToCard(currentIndex, true);
            setTimeout(() => {
              currentIndex = 1;
              goToCard(currentIndex, false);
              isJumping = false;
            }, 300); // tempo menor para evitar travamento
          }
        }, 2000);
      }
      function stopSlider() {
        clearInterval(sliderInterval);
      }
      carrossel.addEventListener('mouseenter', stopSlider);
      carrossel.addEventListener('mouseleave', startSlider);
      startSlider();
    }
    sliderCarrossel();
  }
</script>
